[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noteworthy-study-companion"
version = "0.1.0"
description = "NoteWorthy PDF study companion prototype"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
noteworthy-app = "noteworthy_app.server:main"

[tool.setuptools.packages.find]
include = ["noteworthy_app*"]

[tool.setuptools.package-data]
noteworthy_app = ["static/*.html"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
