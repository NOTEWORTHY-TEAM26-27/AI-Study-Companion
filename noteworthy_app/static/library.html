<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · AI study companion</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="theme.css">

<style>
  #file-input { display: none; }

  table { width: 100%; }
  th {border-bottom: 2px solid #000; text-align: left; padding: 10px 8px;}
  tr[data-href] {cursor: pointer; text-align: left; vertical-align: center; height: 50px;}
  tr:hover {background-color: #f5f5f5;}

  .data-table-wrap { overflow-x: auto; }

  .data-table {
    width: 100%; border-collapse: collapse; font-size: 15px;
    color: #1f2937; background-color: #ffffff;
  }

  .data-table caption {
    caption-side: top; padding: 0.5em 0; font-weight: 600; text-align: left; font-size: 24px;
  }

  .data-table th,
  .data-table td {
    padding: 7px 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid #000000;
  }
  .data-table thead th {
    background-color: #ffffff; color: #000000; font-weight: 600;
  }
  .data-table tbody th { font-weight: 600; }
  .data-table tbody tr:nth-child(even) { background-color: #f7f7f7;}
  .data-table tbody tr:hover { background-color: #e0e0e0; }
  .data-table tbody tr:last-child > * { border-bottom: 0; }

</style>

  <div id="navbar"></div>

  <h1 style="margin-top:48px">Library</h1>

  <section style="margin-top:36px">
    <button id="uploadButton">Upload
      <input type="file" id="file-input">
    </button>

  </section>


<p id="status" role="status" class="muted"></p>

<div class="data-table-wrap">
  <table class="data-table" id="listing">
    <caption>Recent</caption>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Passages</th>
        <th scope="col">Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Start by uploading a PDF!</th>
        <td></td>
        <td></td>
      </tr>

  </tbody>
  </table>
</div>


<script src="navbar.js"></script>
<script src="common.js"></script>
<script>

  const uploader = document.getElementById('uploadButton');
  const fileInput = document.getElementById('file-input');
  
  uploader.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            const uploadedFile = fileInput.files[0];
            uploadFile(uploadedFile);
        }
  });


  // There are no accounts yet, so the list shows only documents uploaded from this browser.
  function myDocumentIds() {
    try {
      const ids = JSON.parse(localStorage.getItem(MY_DOCUMENTS_KEY) || '[]');
      return new Set(Array.isArray(ids) ? ids : []);
    } catch (error) { return new Set(); }
  }
  function rememberDocument(id) {
    const ids = myDocumentIds(); ids.add(id);
    try { localStorage.setItem(MY_DOCUMENTS_KEY, JSON.stringify([...ids])); } catch (error) { /* storage unavailable */ }
  }
  function checkFile(file) {
    if (!file) return 'Choose a PDF first.';
    if (!file.name.toLowerCase().endsWith('.pdf')) return 'Choose a PDF file.';
    if (file.size === 0) return 'The file is empty. Choose a PDF that has content.';
    if (file.size > MAX_PDF_BYTES) return 'The PDF is larger than 12 MB. Choose a smaller file.';
    return '';
  }

  function renderDocuments(documents) {
    storedDocuments = documents;
    const nameCounts = new Map();

    const tbody = document.querySelector('#listing tbody');
    tbody.replaceChildren();

    for (const item of documents) nameCounts.set(item.name, (nameCounts.get(item.name) || 0) + 1);

    for (const uploadedDocument of [...documents, ...pendingUploads]) {

      const row = document.createElement('div'); row.className = 'document';
      const text = document.createElement('span');
      const status = uploadedDocument.status || 'ready';
      const parts = [uploadedDocument.name];

      if (uploadedDocument.id && nameCounts.get(uploadedDocument.name) > 1) parts.push(`ID ${uploadedDocument.id.slice(0, 6)}`);
      if (uploadedDocument.passages !== undefined) parts.push(`${uploadedDocument.passages} passages`);
      parts.push(status === 'failed' && uploadedDocument.error ? `Failed: ${uploadedDocument.error}` : STATUS_LABELS[status] || status);

      const newRow = document.createElement('tr');
      parts.forEach(part => {
          if (parts[1] == part && parts.length == 2) {
            const eItem = document.createElement('td');
            newRow.append(eItem);
          }
          const tItem = document.createElement('td');
          tItem.textContent = part;
          newRow.append(tItem);
      });

      tbody.appendChild(newRow)

    }
  }
  async function loadDocuments() {
    try {
      const response = await fetch('/api/documents');
      if (!response.ok) throw new Error('Could not load your documents.');
      const mine = myDocumentIds();
      renderDocuments(((await response.json()).documents || []).filter(item => mine.has(item.id)));

      if (!selectedDocument) {
        let savedId;
        try { savedId = localStorage.getItem(SELECTED_DOCUMENT_KEY); } catch (error) { /* storage unavailable */ }
      }
      
    } catch (error) {
      $('status').textContent = 'Could not load your documents.';
    }
  }


  async function uploadFile(file) {
      const problem = checkFile(file);
      if (problem) { $('status').textContent = problem; return; }

      const pending = {name: file.name, status: 'processing'};
      pendingUploads = pendingUploads.filter(item => item.name !== file.name).concat(pending);
      renderDocuments(storedDocuments);
      $('uploadButton').disabled = true; 
      $('status').textContent = 'Reading PDF…';

      try {
        const data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = () => reject(new Error('The file could not be read. Choose it again.'));
          reader.readAsDataURL(file);
        });

        const uploaded = await api('/api/upload', {name: file.name, data});
        pendingUploads = pendingUploads.filter(item => item !== pending);
        rememberDocument(uploaded.id);
        await loadDocuments();
        if (!storedDocuments.some(item => item.id === uploaded.id)) storedDocuments = storedDocuments.concat(uploaded);
        $('status').textContent = " ";
      } catch (error) {
        const message = error.message || 'Upload failed. Try again.';
        pending.status = 'failed'; pending.error = message;
        renderDocuments(storedDocuments);
      }
      finally { $('uploadButton').disabled = false; }
    }


  loadDocuments();

</script>
</html>
