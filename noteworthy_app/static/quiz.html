<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Title · AI study companion</title>
<style>
    :root { 
    color-scheme: light; 
    font: 16px/1.5 system-ui, sans-serif;
    background: #fff;
    color: #000; 
    --circumference: 440;
    }
    body { max-width: 1020px; margin: 0 auto; padding: 32px 18px 70px; }
    header { border-bottom: 1px solid #000; margin-bottom: 28px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h2 { font-size: 1.15rem; margin-top: 0; }
    .eyebrow { color: #555; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    section { border: 1px solid #000; padding: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input, button { font: inherit; }
    input[type=text] { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #000; }
    input[type=file] { max-width: 100%; }
    button { border: 1px solid #000; background: #000; color: #fff; padding: 8px 14px; cursor: pointer; margin-top: 12px; }
    button:disabled { background: #fff; color: #888; border-color: #888; cursor: default; }
    .muted { color: #555; }
    #answer { white-space: pre-wrap; }
    .source { padding: 12px 0; border-top: 1px solid #ccc; }
    #status { min-height: 1.5em; }
    .quiz-question { border-top: 1px solid #ccc; padding: 16px 0; }
    .quiz-question label { font-weight: 400; margin: 6px 0; }
    .scorebar { margin: 10px 0; }
    .scorebar span { display: block; height: 8px; background: #000; }
    .document { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ccc; }
    .document span { min-width: 0; overflow-wrap: anywhere; }
    .document button { margin-top: 0; padding: 4px 10px; }

    button:hover { background: #4f4f4f; }

    .radial-progress-container {
    display: flex; justify-content: center;
    align-items: center;
    font-family: system-ui, sans-serif;
    }

    .radial-progress { 
    position: relative; width: 160px; height: 160px;
    }

    .radial-progress svg {
    transform: rotate(-90deg);
    }

    .radial-progress circle {
    fill: none; stroke-width: 12px; stroke-linecap: round;
    }

    .radial-progress .track {
    stroke: #e6e6e6;
    }

    .radial-progress .fill {
    stroke: #000000; stroke-dasharray: var(--circumference);
    stroke-dashoffset: calc(var(--circumference) - (var(--circumference) * var(--progress)) / 100);
    transition: stroke-dashoffset 0.6s ease-in-out;
    }

    .radial-progress .percentage {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 1.5rem; font-weight: bold; color: #333;
    }

    .progress-text {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; font-weight: bold; color: var(--text-color);
    }

    score-section {
         border: 1px solid #000; 
         padding: 18px; 
         display: flex;
        gap: 14px;
    }

    .result-options {
        display: flex; flex-direction: row; flex-wrap: nowrap;
        justify-content: center; align-items: center;
        gap: 8px; min-height: 48px;
    }
    .result-info {
    display: flex; flex-direction: column; flex-wrap: nowrap;
    justify-content: flex-start; align-items: stretch; gap: 4px;
    }

    .large-text { font-size: 24px; font-weight: bold; }
    input:hover {background-color: #f5f5f5;}


</style>
<section id="quiz-test" !hidden>
    <p>How will you conduct this quiz?</p>
    <button id="test">Offline test</button>
    <button id="uploads">Use Uploads</button>
</section>
<section id="quiz-format" hidden>
    <p>How do you want the questions to show?</p>
    <button id="one-only">One at a time</button>
    <button id="all">All at once</button>
</section>

<div id="results" hidden>

    <score-section>
    <label>Your score</label>
    <div class="radial-progress-container">
        <div class="radial-progress" style="--progress: 0;" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
            <svg width="160" height="160" viewBox="0 0 160 160">
            <circle class="track" cx="80" cy="80" r="70"/>
            <circle class="fill" cx="80" cy="80" r="70"/>
            </svg>
            <div class="percentage">0%</div>
        </div>
    </div>
    <div class="result-info">
        <label>Correct:</label>
        <label class="large-text" id="question-total">5 / 5</label>
        <header></header>
        <label>Time:</label>
        <label class="large-text">00:00</label>
    </div>
    </score-section>
    <section>
    <div id="topic-scores">
    </section>

</div>

</div>

<div id="quiz">
</div>

<label id="test-print"></label>

<script>
    let quizMode = 3;
    let questionMode = 3;
    let currentQuestion = 0;
    let totalQuestions = 0;

    const quizTest = document.getElementById("quiz-test");
    const quizFormat = document.getElementById("quiz-format");
    const offlineTest = document.getElementById("test");
    const useUploads = document.getElementById("uploads");
    const oneAtTime = document.getElementById("one-only");
    const allAtOnce = document.getElementById("all");
    const testPrint = document.getElementById("test-print");
    const quizBubble = document.getElementById("quiz");

    const QUESTION_TYPE = Object.freeze({MULTI: "MULTI", BLANK: "BLANK", TRUEFALSE: "TRUEFALSE", SHORT: "SHORT"});

    /* Test questions for each format. */

    const testQuestion1 = {
        question: "Mitochondria is the ______ of the cell.",
        options: ["Powerhouse"],
        answer_index: 0,
        source_id: 3,
        page: 18,
        topic: "Science",
        source_text: "1_Introduction.pdf",
        question_type: QUESTION_TYPE.BLANK
    };
    const testQuestion2 = {
        question: "When you multiply 2 by by how many total fingers you have, what number do you get?",
        options: ["10", "5", "20", "12"],
        answer_index: 2,
        source_id: 3,
        page: 4,
        topic: "Math - Word problems",
        source_text: "Lecture2_3.pdf",
        question_type: QUESTION_TYPE.MULTI
    };
    const testQuestion3 = {
        question: "The sky is blue, right?",
        options: ["True", "False"],
        answer_index: 0,
        source_id: 3,
        page: 3,
        topic: "Philosophy",
        source_text: "MathBook.pdf",
        question_type: QUESTION_TYPE.TRUEFALSE
    };
    const testQuestion4 = {
        question: "Explain what why means.",
        options: ["Why means when you question something."],
        answer_index: 0,
        source_id: 3,
        page: 15,
        topic: "Definitions",
        source_text: "EnglishBook.pdf",
        question_type: QUESTION_TYPE.SHORT
    };

    /* Only the offline test works in this build. */

    offlineTest.addEventListener ( 'click', () => {
        quizMode = 0;
        quizTest.hidden = quizFormat.hidden;
        quizFormat.hidden = !quizFormat.hidden;
    });
    useUploads.addEventListener ('click', () => {
        quizMode = 1;
        quizTest.hidden = quizFormat.hidden;
        quizFormat.hidden = !quizFormat.hidden;
    });
    oneAtTime.addEventListener ('click', () => {
        questionMode = 0;
        quizFormat.hidden = !quizFormat.hidden;
        generateQuestions();
    });
    allAtOnce.addEventListener ('click', () => {
        questionMode = 1;
        quizFormat.hidden = !quizFormat.hidden;
        generateQuestions();
    });

    function generateQuestions() {
        if (quizMode == 0) {
            offlineGenerateQuestions();
        } else {
            offlineGenerateQuestions();
        }
    };

    function fillInTheBlank (block) {
        const textbox = document.createElement('input');
        textbox.type = 'text';
        block.append(textbox);
        return;
    };

    function multiChoice (block, options, qNum) {
        let num = 0;
        options.forEach(option => {
            let label = document.createElement('label');
            let radio = document.createElement('input'); 
            radio.type = 'radio';
            radio.name = `q${qNum}`;
            radio.value = num;
            label.append(radio, option);
            block.append(label);
            num++;
        });
        return;
    };

    function shortAnswer (block) {
        let label = document.createElement('label');
        const textbox = document.createElement('textarea');
        textbox.cols="80";
        textbox.rows="10";
        label.append(textbox)
        block.append(label);
        return;
    };

    function offlineGenerateQuestions() {
        let questionList = [testQuestion1, testQuestion2, testQuestion3, testQuestion4];
        try {
            const container = quizBubble;
            container.replaceChildren();
            questionList.forEach(question => {
                const block = document.createElement('div');
                block.className = 'quiz-question';
                const title = document.createElement('strong');
                block.id = `qu${questionList.indexOf(question)}`;
                title.textContent = (questionList.indexOf(question) + 1) + ". " + question.question;
                block.append(title);
                if (questionMode == 0) { 
                    block.hidden = !block.hidden;
                    if (questionList.indexOf(question) == 0) {block.hidden = !block.hidden;}
                }

                switch (question.question_type) {
                    case QUESTION_TYPE.BLANK:
                        fillInTheBlank(block);
                        break;
                    case QUESTION_TYPE.MULTI:
                        multiChoice(block, question.options, questionList.indexOf(question));
                        break;
                    case QUESTION_TYPE.SHORT:
                        shortAnswer(block);
                        break;
                    case QUESTION_TYPE.TRUEFALSE:
                        multiChoice(block, ["True", "False"], questionList.indexOf(question));
                        break;
                }
                container.append(block);
                totalQuestions++;
            });

            const submit = document.createElement('button');
            submit.textContent = 'Submit';

            if (questionMode == 0) {
                submit.hidden = !submit.hidden;
                const previous = document.createElement('button');
                const next = document.createElement('button');
                previous.textContent = 'Previous';
                next.textContent = 'Next';

                previous.onclick = () => {
                    if (currentQuestion == totalQuestions - 1) { 
                        next.hidden = !next.hidden;
                        submit.hidden = !submit.hidden;
                    }
                    currentQuestion--;
                    if (currentQuestion == 0) { 
                        previous.hidden = !previous.hidden;
                    }
                    const pQuestion = document.getElementById(`qu${currentQuestion}`);
                    const nQuestion = document.getElementById(`qu${currentQuestion + 1}`);
                    pQuestion.hidden = !pQuestion.hidden;
                    nQuestion.hidden = !nQuestion.hidden;

                }
                previous.hidden = !previous.hidden;
                next.onclick = () => {
                    if (currentQuestion == 0) { previous.hidden = !previous.hidden; }
                    currentQuestion++;
                    if (currentQuestion == totalQuestions - 1) { 
                        next.hidden = !next.hidden;
                        submit.hidden = !submit.hidden;
                    }
                    const pQuestion = document.getElementById(`qu${currentQuestion - 1}`);
                    const nQuestion = document.getElementById(`qu${currentQuestion}`);
                    pQuestion.hidden = !pQuestion.hidden;
                    nQuestion.hidden = !nQuestion.hidden;

                }
                container.append(previous);
                container.append(next);

            }

            submit.onclick = () => {
                let correct = 0;
                let num = 0;
                let topics = {};

                questionList.forEach(question => { 
                    let chosen;
                    let right;
                    let label = document.createElement("label");
                    let qId = `qu${questionList.indexOf(question)}`;
                    let selectedQuestion = document.getElementById(qId);
                    topics[question.topic] ||= {correct: 0, total: 0};

                    switch (question.question_type) {
                        case QUESTION_TYPE.BLANK:
                            break;
                        case QUESTION_TYPE.MULTI:
                            chosen = document.querySelector(`input[name=q${questionList.indexOf(question)}]:checked`);
                            right = chosen && Number(chosen.value) === question.answer_index;
                            if (right) { correct++; topics[question.topic].correct++;}
                            break;
                        case QUESTION_TYPE.SHORT:
                            break;
                        case QUESTION_TYPE.TRUEFALSE:
                            chosen = document.querySelector(`input[name=q${questionList.indexOf(question)}]:checked`);
                            right = chosen && Number(chosen.value) === question.answer_index;
                            if (right) { correct++; topics[question.topic].correct++;}
                            break;
                    }
                    topics[question.topic].total++;
                    label.textContent = "Correct answer: " + question.options[question.answer_index];
                    selectedQuestion.append(label);
                    label = document.createElement("label");
                    label.textContent = "Source: " + question.source_text + " on page " + question.page;
                    selectedQuestion.append(label);
                    if (questionMode == 0 && num != totalQuestions - 1) { 
                        selectedQuestion.hidden = !selectedQuestion.hidden;
                    }
                    num++;
                });

                if (questionMode == 0) {
                    previous.hidden = !previous.hidden;
                }
                submit.hidden = !submit.hidden;
                testPrint.textContent = "Correct: " + correct + " / " + totalQuestions;
                results(correct, num, topics);
            }
            container.append(submit);

        } catch (error) {
            testPrint.textContent = "Error: " + error;
            return;
        }

        return;
    };

    function setMainScore(element, value) {
        const clamp = Math.max(0, Math.min(100, value));
        element.style.setProperty('--progress', clamp);
        element.setAttribute('aria-valuenow', clamp);
        const label = element.querySelector('.percentage');
        if (label) {
            label.textContent = `${clamp}%`;
        }
    }

    function results(correct, total, topics) {
        let results = document.getElementById("results");
        results.hidden = !results.hidden;
        let resultInfo = document.getElementById("result-info");

        let label = document.getElementById("question-total");
        label.textContent = correct + " / " + total;

        let score = (correct / total) * 100;

        const progressBar = document.querySelector('.radial-progress');
        setMainScore(progressBar, score);

        let topicScores = document.getElementById("topic-scores");
        label = document.createElement("label");
        label.className = "large-text";
        label.textContent = "Scores by Topic";
        topicScores.append(label);

        for (const topic of Object.keys(topics)) {
            label = document.createElement("label");
            label.textContent = topic + ":  " + topics[topic].correct + " / " + topics[topic].total;
            topicScores.append(label);
        }

        return;
    }
    
    function uploadGenerateQuestions() {
        return;
    };


</script>
